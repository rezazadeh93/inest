version: '3.8'
services:
#  webserver:
#    build:
#      context: .
#      target: development
#    image: inest-dev-image:latest
#    ports:
#      - 2002:2002
#      - 2000:2000
#    volumes:
#      - ./:/app
  keycloak:
    image: jboss/keycloak
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgresql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_SCHEMA: public
      DB_PASSWORD: keycloak!@#
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
    depends_on:
      - postgresql
    ports:
      - 2001:8080
  postgresql:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD='DB!@#'
    volumes:
      - database-data:/var/lib/postgresql/data
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'DB!@#'
    ports:
      - 2003:80

volumes:
  database-data:
