version: '3.8'
services:
  webserver:
    build:
      context: .
      target: development
    image: inest-dev-image:latest
    ports:
      - 2002:2002
      - 2000:2000
    volumes:
      - ./:/app
  postgresql:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: 'DB!@#'
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'DB!@#'
    ports:
      - 2003:80

  mongo:
    image: mongo
    restart: unless-stopped
    ports:
    - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: MongoDB123
    volumes:
      - mongodb_data:/data/db
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 2004:8081
    environment:
      ME_CONFIG_OPTIONS_EDITORTHEME: ambiance
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:MongoDB123@mongo:27017/

volumes:
  postgresql_data:
  mongodb_data:

