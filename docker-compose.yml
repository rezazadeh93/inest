version: '3.8'
services:
  web:
    build:
      context: .
      target: development
    image: inest-dev-image:latest
    ports:
      - 2002:2002
      - 2000:2000
    volumes:
      - ./:/app
  postgresql:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: 'DB!@#'
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin4_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'DB!@#'
    ports:
      - 2003:80
  mongo:
    image: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 'DB!@#'
  mongo-express:
    image: mongo-express
    ports:
      - 2004:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:DB%21%40%23@mongo:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: 'DB!@#'


volumes:
  postgresql_data:
  mongodb_data:
